name: DevOps CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/m-lmran/devops-vle5
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-00cc1f36f97ff9294

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            -t "$IMAGE_NAME:latest" .

      - name: Login to GitHub Container Registry
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker images
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:latest"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598391748654:role/GitHubDevOpsLabDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Kubernetes through SSM
        run: |
          set -e

          PARAMETERS=$(jq -n \
            --arg image "$IMAGE_NAME:$IMAGE_TAG" \
            '{
              commands: [
                "set -e",
                ("sudo k3s kubectl set image deployment/devops-app devops-app=" + $image),
                "sudo k3s kubectl rollout status deployment/devops-app --timeout=180s",
                "sudo k3s kubectl get deployment devops-app",
                "sudo k3s kubectl get pods -l app=devops-app"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DevOps app to Kubernetes" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for i in $(seq 1 45); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] ||
               [ "$STATUS" = "Cancelled" ] ||
               [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json || true
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for deployment."
          exit 1
