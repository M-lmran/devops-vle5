name: DevOps CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/m-lmran/devops-vle5:latest
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-00cc1f36f97ff9294

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME" .

      - name: Login to GitHub Container Registry
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        run: docker push "$IMAGE_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598391748654:role/GitHubDevOpsLabDeployRole
          aws-region: us-east-1

      - name: Deploy to EC2 through SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DevOps Virtual Lab" \
            --parameters 'commands=[
              "sudo docker pull ghcr.io/m-lmran/devops-vle5:latest",
              "sudo docker stop devops-virtual-lab || true",
              "sudo docker rm devops-virtual-lab || true",
              "sudo docker run -d --name devops-virtual-lab --restart unless-stopped -p 8080:8080 ghcr.io/m-lmran/devops-vle5:latest"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json || true
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for deployment."
          exit 1
